# Learn Hub Docker Compose — Postgres + Ollama
#
# One datastore: Postgres (replaced ArangoDB and Qdrant). Services:
#   app (Next.js UI) · learn (FastAPI study engine) · postgres · ollama
#
# Usage:
#   docker compose up -d

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
    ports:
      # Loopback-only publish: `tailscale serve` fronts this as https on 3001 and
      # needs the tailnet IP free (see fleet-ui/apps.js on the migration).
      - '127.0.0.1:3001:3000'
    environment:
      # Postgres is the one datastore (auth + per-user data via schema tenancy).
      - POSTGRES_DSN=host=postgres port=5432 user=learnhub password=${POSTGRES_PASSWORD:?set in compose/.env} dbname=learnhub
      # Auth.js (login sessions)
      - AUTH_SECRET=${AUTH_SECRET:?set in compose/.env}
      - AUTH_TRUST_HOST=true
      # Ollama configuration
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=nemotron-3-nano:30b
      # Other settings
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NODE_OPTIONS=--max-http-header-size=80000
      - UV_THREADPOOL_SIZE=128
      - HTTP_TIMEOUT=1800000
      - REQUEST_TIMEOUT=1800000
      - LEARN_SERVICE_URL=http://learn:8000
    volumes:
      - learnhub_core_shared:/shared
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      learn:
        condition: service_started

  # Python learning app (placeholder UI; same Postgres + shared volume as the learn service)
  learn:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:8010:8000'
    environment:
      # Postgres is the one datastore (ArangoDB + Qdrant retired).
      - POSTGRES_DSN=host=postgres port=5432 user=learnhub password=${POSTGRES_PASSWORD:?set in compose/.env} dbname=learnhub
      - SHARED_DIR=/shared
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=nemotron-3-nano:30b
      # Quizzes use the deterministic triple-based builder (no LLM) so studying never loads a
      # model — concept extraction is the only LLM workload. Set to 1 to re-enable LLM quizzes.
      - LEARN_QUIZ_LLM=0
      # Model that authors the higher-order concept quiz MCQs (apply/distinguish/why) + the critic
      # revision pass. A fast 8B instruct model keeps one-time background authoring practical
      # (~1 min/concept); the big reasoning default would be ~10 min/concept. Empty = OLLAMA_MODEL.
      - LEARN_QUIZ_AUTHOR_MODEL=gemma4:latest
      # Concept extraction. Same reasoning as the line above, and it was missing: unset,
      # this falls through to OLLAMA_MODEL, and the big reasoning default is the wrong
      # tool for it. Measured on §1 with per-section coalescing: nemotron 3,847s with 12
      # timeouts and 0 concepts stored; gemma4 160s, 8 concepts, 0 errors. Extraction is
      # the only LLM workload left in the app, so this default is the one that matters.
      - LEARN_EXTRACT_MODEL=gemma4:latest
      # PDF->Markdown converter: "docling" (higher fidelity) | "pymupdf" (lightweight fallback)
      - LEARN_CONVERTER=docling
      # Docling's torch/table/layout models run on the GB10 GPU (cu130 wheel in the image).
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - learnhub_core_shared:/shared
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # PostgreSQL — the one datastore (replaced ArangoDB + Qdrant).
  postgres:
    image: postgres:16
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      - POSTGRES_DB=learnhub
      - POSTGRES_USER=learnhub
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in compose/.env}
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - default
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learnhub -d learnhub']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Ollama - Local LLM inference (first build mostly pulls ollama/ollama base image; can take many minutes)
  ollama:
    build:
      context: ../services/ollama
      dockerfile: Dockerfile
    image: ollama-custom:latest
    container_name: ollama-compose
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=30m
      # NUM_PARALLEL=2 is back to serving ordinary LLM concurrency only. It was briefly
      # raised to 8 as the audiobook throughput knob — Orpheus decode was bandwidth-bound,
      # so batching amortised the weight read: measured 2 slots 1.13x realtime, 4 slots
      # 1.72x, 8 slots 2.40x (sublinear, and 12 streams against 8 slots fell BACK to 1.64x).
      # TTS moved to Kokoro, which is non-autoregressive and flat under concurrency, so that
      # justification is gone and the extra KV per slot — charged against EVERY model,
      # including the 50GB coder ones — is no longer worth paying.
      # The old crash was NUM_PARALLEL=4 × a MILLION-token context — with
      # the 16K context cap below + q8_0 KV, a second slot costs only a few GB of KV
      # per warm model, well inside headroom. MAX_LOADED_MODELS=4 keeps a coder +
      # general + embed + vision model warm without evict-churn: safe on the 121GB
      # unified pool — Ollama's scheduler refuses to load a model that wouldn't fit
      # (a too-big model evicts an idle one or queues; no OOM from slots). Big 40GB+
      # weights still can't all be warm at once; watch headroom in the GUI readout.
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=4
      # Cap the per-model context so a million-token-capable model can't size its KV cache
      # to the full window. 16K is ample for per-section extraction; raise if needed.
      - OLLAMA_CONTEXT_LENGTH=16384
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_GPU_LAYERS=-1
      - OLLAMA_LLM_LIBRARY=cuda_v13
    networks:
      - default
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  ollama_data:
  learnhub_core_shared:
  postgres_core_data:

networks:
  default:
    driver: bridge
