<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Socratic chat</title>
  {% include "partials/katex_head.html" %}
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 48rem; line-height: 1.5; }
    a { color: #1a6; }
    .meta { color: #555; font-size: 0.9rem; }
    #log { border: 1px solid #ddd; border-radius: 8px; padding: 0.75rem; min-height: 12rem; max-height: 24rem; overflow-y: auto; background: #fafafa; margin: 1rem 0; }
    .msg { margin: 0.5rem 0; padding: 0.35rem 0.5rem; border-radius: 4px; }
    .user { background: #e8f4ff; }
    .assistant { background: #f0f0f0; }
    .system { font-size: 0.85rem; color: #666; }
    textarea { width: 100%; min-height: 4rem; box-sizing: border-box; }
    button { margin-top: 0.5rem; padding: 0.45rem 0.9rem; cursor: pointer; }
    .err { color: #a00; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <p class="meta"><a href="/">Home</a> · <a href="/tree">TOC tree</a> · Optional <code>?scope=toc:1.1.1</code> limits graph context.</p>
  <h1>Socratic chat</h1>
  <p id="ctx" class="meta"></p>
  <div id="log"></div>
  <label for="input">Your message</label>
  <textarea id="input"></textarea>
  <button type="button" id="send">Send</button>
  <p id="err" class="err" hidden></p>

  {% include "partials/katex_scripts.html" %}
  <script>
    function el(id) { return document.getElementById(id); }
    const params = new URLSearchParams(window.location.search);
    const scope = params.get('scope') || null;
    const messages = [];

    function addLine(role, text) {
      const log = document.getElementById('log');
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      if (role === 'user') {
        div.textContent = 'You: ' + text;
      } else {
        const prefix = document.createElement('span');
        prefix.textContent = 'Tutor: ';
        const body = document.createElement('span');
        window.learnMath.setTextWithMath(body, text);
        div.appendChild(prefix);
        div.appendChild(body);
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    document.getElementById('send').addEventListener('click', async () => {
      const ta = document.getElementById('input');
      const text = ta.value.trim();
      if (!text) return;
      ta.value = '';
      el('err').hidden = true;
      messages.push({ role: 'user', content: text });
      addLine('user', text);
      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages, scope, include_structural: false }),
        });
        const data = await r.json();
        if (!r.ok) {
          const d = data.detail;
          el('err').hidden = false;
          el('err').textContent = typeof d === 'string' ? d : JSON.stringify(d);
          messages.pop();
          return;
        }
        document.getElementById('ctx').textContent =
          'Context: ' + data.contextTripleCount + ' triples' + (data.scope ? ' · scope ' + data.scope : '');
        messages.push({ role: 'assistant', content: data.reply });
        addLine('assistant', data.reply);
      } catch (e) {
        el('err').hidden = false;
        el('err').textContent = String(e);
        messages.pop();
      }
    });
  </script>
</body>
</html>
